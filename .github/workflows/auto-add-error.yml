name: Auto Ingest Error Code from Issue (Strategy B)

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write

jobs:
  validate-or-apply:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'error-candidate') || github.event.label.name == 'approved' || github.event.label.name == 'auto-merge'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 1: When Issue is opened/edited, run verification (Dry-Run)
      - name: Verify Issue Schema
        if: github.event.action == 'opened' || github.event.action == 'edited'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          node -e '
            import("./scripts/ingest-issue-error.mjs").then(async ({ ingestError }) => {
              const body = process.env.ISSUE_BODY;
              const issueNumber = process.env.ISSUE_NUMBER;
              const token = process.env.GITHUB_TOKEN;
              const repo = process.env.GITHUB_REPOSITORY;

              try {
                const res = await ingestError(body, { apply: false });
                const item = res.item;
                const comment = `### ✅ 错误代码格式校验通过 (Validation Passed)
  
| 字段 | 提取结果 |
| :--- | :--- |
| **渠道服务商 (Provider)** | \`${item.providerNameZh} (${item.provider})\` |
| **错误代码 (Code)** | \`#${item.code}\` |
| **严重级别 (Severity)** | \`${item.severity}\` |
| **分类 (Category)** | \`${item.categoryNameZh} (${item.category})\` |
| **中文名称 (Title Zh)** | **${item.titleZh}** |
| **英文原名 (Title En)** | ${item.titleEn} |
| **HTTP Code** | ${item.httpStatus || "N/A"} |

#### 预览 JSON 报文
\`\`\`json
${JSON.stringify(item, null, 2)}
\`\`\`

> 💡 **状态说明**：本项目已启用 **维护者审核确认策略 (Strategy B)**。维护者查验无误后打上 \`approved\` 标签，系统将自动合入主分支并部署发布。`;

                // Post comment to Issue via GitHub API
                await fetch(`https://api.github.com/repos/${repo}/issues/${issueNumber}/comments`, {
                  method: "POST",
                  headers: {
                    "Authorization": `Bearer ${token}`,
                    "Accept": "application/vnd.github.v3+json",
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({ body: comment })
                });
              } catch (err) {
                const errorComment = `### ❌ 格式校验未通过 (Validation Failed)\n\n系统解析该表单时遇到以下问题：\n- **原因**：${err.message}\n\n请点击右上角 \`Edit\` 完善对应必填项后保存，系统将重新自动校验。`;
                await fetch(`https://api.github.com/repos/${repo}/issues/${issueNumber}/comments`, {
                  method: "POST",
                  headers: {
                    "Authorization": `Bearer ${token}`,
                    "Accept": "application/vnd.github.v3+json",
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({ body: errorComment })
                });
                process.exit(1);
              }
            });
          '

      # Step 2: When Maintainer adds 'approved' or 'auto-merge' label, apply and commit
      - name: Apply Ingestion and Commit
        if: github.event.action == 'labeled' && (github.event.label.name == 'approved' || github.event.label.name == 'auto-merge')
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          node -e '
            import("./scripts/ingest-issue-error.mjs").then(async ({ ingestError }) => {
              const body = process.env.ISSUE_BODY;
              const res = await ingestError(body, { apply: true });
              console.log("Successfully merged:", res.item.code);
            });
          '

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/whatsapp-errors.json
          git commit -m "feat(errors): auto-ingest error code from #${{ github.event.issue.number }} (@${{ github.event.issue.user.login }})"
          git push origin main

          # Post success comment and close issue
          node -e '
            const token = process.env.GITHUB_TOKEN;
            const repo = process.env.GITHUB_REPOSITORY;
            const issueNumber = process.env.ISSUE_NUMBER;
            const user = process.env.ISSUE_USER;

            const successComment = `🎉 **感谢 @${user} 的贡献！** 该错误代码已成功合并入库并推送至主分支，前台速查字典与 PWA 离线缓存将在 1-2 分钟内自动部署更新。`;

            // Post comment
            fetch(`https://api.github.com/repos/${repo}/issues/${issueNumber}/comments`, {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${token}`,
                "Accept": "application/vnd.github.v3+json",
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ body: successComment })
            }).then(() => {
              // Close issue as completed
              return fetch(`https://api.github.com/repos/${repo}/issues/${issueNumber}`, {
                method: "PATCH",
                headers: {
                  "Authorization": `Bearer ${token}`,
                  "Accept": "application/vnd.github.v3+json",
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({ state: "closed", state_reason: "completed" })
              });
            });
          '
